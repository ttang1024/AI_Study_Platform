# Example production overrides. Combine with a gitignored secrets file:
#   helm upgrade --install study-platform ./k8s/helm/study-platform \
#     -f k8s/helm/study-platform/values.yaml \
#     -f k8s/helm/study-platform/values-production.yaml \
#     -f secrets.values.yaml
#
# This still runs postgres/redis/minio in-cluster. To use managed AWS
# services instead (RDS/ElastiCache/S3, as in deploy.sh today), set
# postgres.enabled / redis.enabled / minio.enabled to false and point
# secret-app.yaml's derived values at your managed endpoints instead
# (or use secrets.existingSecretName with your own Secret).

global:
  storageClass: gp3 # or your cluster's SSD-backed StorageClass

api:
  replicaCount: 1 # do not raise — see NOTES.txt
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

web:
  replicaCount: 3

admin:
  replicaCount: 2

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  web:
    host: study.example.com
  admin:
    host: admin.example.com
  api:
    host: api.example.com
  tls:
    - secretName: study-platform-tls
      hosts:
        - study.example.com
        - admin.example.com
        - api.example.com

postgres:
  storage: 50Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi

redis:
  storage: 5Gi

minio:
  storage: 100Gi
