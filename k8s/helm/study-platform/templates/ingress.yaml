{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "study-platform.fullname" . }}
  labels:
    {{- include "study-platform.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.ingress.web.host }}
    - host: {{ .Values.ingress.web.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "study-platform.fullname" . }}-web
                port:
                  number: 80
    {{- end }}
    {{- if .Values.ingress.admin.host }}
    - host: {{ .Values.ingress.admin.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "study-platform.fullname" . }}-admin
                port:
                  number: 80
    {{- end }}
    {{- if .Values.ingress.api.host }}
    - host: {{ .Values.ingress.api.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "study-platform.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
    {{- end }}
{{- end }}
