apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "study-platform.fullname" . }}-api-config
  labels:
    {{- include "study-platform.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
data:
  ASPNETCORE_ENVIRONMENT: {{ .Values.api.env.aspnetcoreEnvironment | quote }}
  ASPNETCORE_HTTP_PORTS: {{ .Values.api.port | quote }}

  AWS__Region: {{ .Values.api.env.awsRegion | quote }}
  S3__BucketName: {{ .Values.minio.bucket | quote }}
  S3__ForcePathStyle: {{ .Values.api.env.s3ForcePathStyle | quote }}

  Redis__Enabled: {{ .Values.api.env.redisEnabled | quote }}
  Redis__InstanceName: "StudyPlatform:"

  Cache__DashboardStatsSeconds: {{ .Values.api.env.cacheDashboardStatsSeconds | quote }}
  Cache__AnalyticsSummarySeconds: {{ .Values.api.env.cacheAnalyticsSummarySeconds | quote }}
  Cache__GeneratedResultSeconds: {{ .Values.api.env.cacheGeneratedResultSeconds | quote }}

  JwtSettings__Issuer: {{ .Values.api.env.jwtIssuer | quote }}
  JwtSettings__Audience: {{ .Values.api.env.jwtAudience | quote }}
  JwtSettings__AccessTokenExpiryMinutes: {{ .Values.api.env.jwtAccessTokenExpiryMinutes | quote }}
  JwtSettings__RefreshTokenExpiryDays: {{ .Values.api.env.jwtRefreshTokenExpiryDays | quote }}

  EmailSettings__FromName: {{ .Values.api.env.emailFromName | quote }}
  EmailSettings__SmtpHost: {{ .Values.api.env.smtpHost | quote }}
  EmailSettings__SmtpPort: {{ .Values.api.env.smtpPort | quote }}

  {{- range $i, $origin := .Values.api.env.corsAllowedOrigins }}
  Cors__AllowedOrigins__{{ $i }}: {{ $origin | quote }}
  {{- end }}

  AppLimits__DocumentUploadLimit: {{ .Values.api.env.documentUploadLimit | quote }}

  YouTube__SubtitleLanguages: {{ .Values.api.env.youtubeSubtitleLanguages | quote }}
  YouTube__HttpTimeoutSeconds: {{ .Values.api.env.youtubeHttpTimeoutSeconds | quote }}
