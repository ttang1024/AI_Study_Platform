apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "study-platform.fullname" . }}-api
  labels:
    {{- include "study-platform.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  # See values.yaml: api.replicaCount — background workers are single-replica only.
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "study-platform.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "study-platform.selectorLabels" (dict "root" . "component" "api") | nindent 8 }}
    spec:
      {{- if or .Values.postgres.enabled .Values.redis.enabled .Values.minio.enabled }}
      initContainers:
        {{- if .Values.postgres.enabled }}
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ include "study-platform.fullname" . }}-postgres 5432; do echo waiting for postgres; sleep 2; done']
        {{- end }}
        {{- if .Values.redis.enabled }}
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ include "study-platform.fullname" . }}-redis 6379; do echo waiting for redis; sleep 2; done']
        {{- end }}
        {{- if .Values.minio.enabled }}
        - name: wait-for-minio
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ include "study-platform.fullname" . }}-minio 9000; do echo waiting for minio; sleep 2; done']
        {{- end }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: {{ include "study-platform.fullname" . }}-api-config
            - secretRef:
                name: {{ include "study-platform.secretName" . }}
          volumeMounts:
            - name: dataprotection-keys
              mountPath: /root/.aspnet/DataProtection-Keys
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: dataprotection-keys
          persistentVolumeClaim:
            claimName: {{ include "study-platform.fullname" . }}-api-dataprotection
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "study-platform.fullname" . }}-api
  labels:
    {{- include "study-platform.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "study-platform.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
