apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "study-platform.fullname" . }}-admin
  labels:
    {{- include "study-platform.selectorLabels" (dict "root" . "component" "admin") | nindent 4 }}
spec:
  replicas: {{ .Values.admin.replicaCount }}
  selector:
    matchLabels:
      {{- include "study-platform.selectorLabels" (dict "root" . "component" "admin") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "study-platform.selectorLabels" (dict "root" . "component" "admin") | nindent 8 }}
    spec:
      containers:
        - name: admin
          image: "{{ .Values.admin.image.repository }}:{{ .Values.admin.image.tag }}"
          imagePullPolicy: {{ .Values.admin.image.pullPolicy }}
          ports:
            - containerPort: 80
          env:
            - name: API_BACKEND_URL
              value: {{ printf "http://%s-api:%v" (include "study-platform.fullname" .) .Values.api.port | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "study-platform.fullname" . }}-admin
  labels:
    {{- include "study-platform.selectorLabels" (dict "root" . "component" "admin") | nindent 4 }}
spec:
  type: {{ .Values.admin.service.type }}
  selector:
    {{- include "study-platform.selectorLabels" (dict "root" . "component" "admin") | nindent 4 }}
  ports:
    - port: 80
      targetPort: 80
