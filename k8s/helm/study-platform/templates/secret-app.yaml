{{- if not .Values.secrets.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "study-platform.secretName" . }}
  labels:
    {{- include "study-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  # --- Postgres / MinIO root credentials (consumed by the StatefulSets too) ---
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  MINIO_ROOT_USER: {{ .Values.secrets.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioRootPassword | quote }}

  # --- API config keys (ASP.NET Core double-underscore binding) ---
  ConnectionStrings__DefaultConnection: {{ printf "Host=%s-postgres;Port=5432;Database=%s;Username=%s;Password=%s" (include "study-platform.fullname" .) .Values.postgres.db .Values.postgres.user .Values.secrets.postgresPassword | quote }}

  AWS_ACCESS_KEY_ID: {{ .Values.secrets.minioRootUser | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.minioRootPassword | quote }}
  S3__AccessKey: {{ .Values.secrets.minioRootUser | quote }}
  S3__SecretKey: {{ .Values.secrets.minioRootPassword | quote }}
  S3__ServiceUrl: {{ printf "http://%s-minio:9000" (include "study-platform.fullname" .) | quote }}
  S3__PublicServiceUrl: {{ printf "https://%s" .Values.ingress.api.host | quote }}

  Redis__ConnectionString: {{ printf "%s-redis:6379" (include "study-platform.fullname" .) | quote }}

  JwtSettings__SecretKey: {{ .Values.secrets.jwtSecretKey | quote }}

  EmailSettings__FromEmail: {{ .Values.secrets.emailFrom | quote }}
  EmailSettings__SmtpUser: {{ .Values.secrets.smtpUser | quote }}
  EmailSettings__SmtpPassword: {{ .Values.secrets.smtpPassword | quote }}

  GoogleOAuth__ClientId: {{ .Values.secrets.googleClientId | quote }}
  GoogleOAuth__ClientSecret: {{ .Values.secrets.googleClientSecret | quote }}
  GitHubOAuth__ClientId: {{ .Values.secrets.githubClientId | quote }}
  GitHubOAuth__ClientSecret: {{ .Values.secrets.githubClientSecret | quote }}

  Vapid__PublicKey: {{ .Values.secrets.vapidPublicKey | quote }}
  Vapid__PrivateKey: {{ .Values.secrets.vapidPrivateKey | quote }}
  Vapid__Subject: {{ .Values.secrets.vapidSubject | quote }}

  YouTube__ProxyUrl: {{ .Values.secrets.youtubeProxyUrl | quote }}
  YouTube__CookiesBase64: {{ .Values.secrets.youtubeCookiesB64 | quote }}
{{- end }}
