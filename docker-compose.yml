services:
  postgres:
    # pgvector/pgvector is stock Postgres 17 with the vector extension preinstalled — semantic
    # search creates it on migrate, which plain postgres:17-alpine cannot do.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studyplatform}
      POSTGRES_USER: ${POSTGRES_USER:-studyplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studyplatform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${REDIS_PORT:-6379}:6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-documents-dev}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET_NAME"

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - data_protection_keys:/root/.aspnet/DataProtection-Keys
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-studyplatform};Username=${POSTGRES_USER:-studyplatform};Password=${POSTGRES_PASSWORD}"
      AWS__Region: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3__BucketName: ${S3_BUCKET_NAME:-documents-dev}
      S3__ServiceUrl: ${S3_SERVICE_URL:-http://minio:9000}
      S3__PublicServiceUrl: ${S3_PUBLIC_SERVICE_URL:-http://localhost:9000}
      S3__ForcePathStyle: ${S3_FORCE_PATH_STYLE:-true}
      S3__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      S3__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      Redis__Enabled: ${REDIS_ENABLED:-true}
      Redis__ConnectionString: "redis:6379"
      Redis__InstanceName: ${REDIS_INSTANCE_NAME:-StudyPlatform:}
      Cache__DashboardStatsSeconds: ${CACHE_DASHBOARD_STATS_SECONDS:-60}
      Cache__AnalyticsSummarySeconds: ${CACHE_ANALYTICS_SUMMARY_SECONDS:-300}
      Cache__GeneratedResultSeconds: ${CACHE_GENERATED_RESULT_SECONDS:-3600}
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: ${JWT_ISSUER:-Study Platform}
      JwtSettings__Audience: ${JWT_AUDIENCE:-Study Platform Users}
      JwtSettings__AccessTokenExpiryMinutes: ${JWT_ACCESS_EXPIRY_MINUTES:-15}
      JwtSettings__RefreshTokenExpiryDays: ${JWT_REFRESH_EXPIRY_DAYS:-7}
      EmailSettings__FromEmail: ${EMAIL_FROM}
      EmailSettings__FromName: ${EMAIL_FROM_NAME:-Study Platform}
      EmailSettings__SmtpHost: ${SMTP_HOST:-smtp.gmail.com}
      EmailSettings__SmtpPort: ${SMTP_PORT:-587}
      EmailSettings__SmtpUser: ${SMTP_USER}
      EmailSettings__SmtpPassword: ${SMTP_PASSWORD}
      GoogleOAuth__ClientId: ${GOOGLE_CLIENT_ID}
      GoogleOAuth__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      GitHubOAuth__ClientId: ${GITHUB_CLIENT_ID}
      GitHubOAuth__ClientSecret: ${GITHUB_CLIENT_SECRET}
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:3000}
      Cors__AllowedOrigins__1: ${ADMIN_ORIGIN:-http://localhost:4200}
      AppLimits__DocumentUploadLimit: ${DOCUMENT_UPLOAD_LIMIT:-20}
      YouTube__SubtitleLanguages: ${YOUTUBE_SUBTITLE_LANGUAGES:-en.*,en}
      YouTube__ProxyUrl: ${YOUTUBE_PROXY_URL:-}
      YouTube__CookiesBase64: ${YOUTUBE_COOKIES_B64:-}
      YouTube__HttpTimeoutSeconds: ${YOUTUBE_HTTP_TIMEOUT_SECONDS:-60}
    ports:
      - "${API_PORT:-5000}:5000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        VITE_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BACKEND_URL: http://api:5000
    ports:
      - "3000:80"

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BACKEND_URL: http://api:5000
    ports:
      - "4200:80"

volumes:
  postgres_data:
  data_protection_keys:
  redis_data:
  minio_data:
